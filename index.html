const yearColors = {
  '2019': 'bg-purple-100 text-purple-700',
  '2020': 'bg-pink-100 text-pink-700',
  '2021': 'bg-red-100 text-red-700',
  '2022': 'bg-orange-100 text-orange-700',
  '2023': 'bg-yellow-100 text-yellow-700',
  '2024': 'bg-green-100 text-green-700',
  '2025': 'bg-blue-100 text-blue-700',
  '2026': 'bg-indigo-100 text-indigo-700',
};

let currentPage = 1;
let rowsPerPage = 50;
let filteredData = [...ALL_DATA];
let searchTerm = '';
let yearFilter = '';
let searchTimer = null;

function getYear(dateStr) {
  if (!dateStr || dateStr === '-') return '';
  const parts = dateStr.split('/');
  return parts.length === 3 ? parts[2] : '';
}

function highlight(text, term) {
  if (!term) return escapeHtml(text);
  const escaped = escapeHtml(text);
  const re = new RegExp('(' + escapeRe(term) + ')', 'gi');
  return escaped.replace(re, '<mark class="bg-yellow-200 rounded px-0.5">$1</mark>');
}

function escapeHtml(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function escapeRe(str) {
  return str.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
}

let sortKey = '';
let sortDir = 1;

function parseDate(str) {
  if (!str || str === '-') return 0;
  const parts = str.split('/');
  if (parts.length !== 3) return 0;
  return parseInt(parts[2] + parts[1] + parts[0]) || 0;
}

function sortBy(key) {
  if (sortKey === key) {
    sortDir = -sortDir;
  } else {
    sortKey = key;
    sortDir = 1;
  }
  document.querySelectorAll('th.sortable').forEach(th => {
    th.classList.remove('sort-asc', 'sort-desc');
    if (th.dataset.col === key) {
      th.classList.add(sortDir === 1 ? 'sort-asc' : 'sort-desc');
    }
  });
  applyFilters();
}

function applyFilters() {
  const term = searchTerm.toLowerCase().trim();
  filteredData = ALL_DATA.filter(row => {
    const yearMatch = !yearFilter || getYear(row['Tarikh Aktiviti Mula']) === yearFilter || getYear(row['Tarikh Aktiviti Tamat']) === yearFilter;
    const searchMatch = !term || 
      row['Nama Aktiviti'].toLowerCase().includes(term) ||
      row['Nama Syarikat'].toLowerCase().includes(term) ||
      row['No Lesen'].toLowerCase().includes(term) ||
      row['Tarikh Aktiviti Mula'].includes(term) ||
      row['Tarikh Aktiviti Tamat'].includes(term);
    return yearMatch && searchMatch;
  });
  if (sortKey) {
    const dateCols = ['Tarikh Aktiviti Mula', 'Tarikh Aktiviti Tamat'];
    filteredData.sort((a, b) => {
      const av = sortKey === 'Tahun' ? (getYear(a['Tarikh Aktiviti Mula']) || '') : (a[sortKey] || '');
      const bv = sortKey === 'Tahun' ? (getYear(b['Tarikh Aktiviti Mula']) || '') : (b[sortKey] || '');
      if (dateCols.includes(sortKey)) return (parseDate(av) - parseDate(bv)) * sortDir;
      if (sortKey === 'No' || sortKey === 'Tahun') return (parseInt(av) - parseInt(bv)) * sortDir;
      return av.localeCompare(bv, 'ms') * sortDir;
    });
  }
  currentPage = 1;
  render();
}

function render() {
  const total = filteredData.length;
  const totalPages = Math.max(1, Math.ceil(total / rowsPerPage));
  if (currentPage > totalPages) currentPage = totalPages;

  const start = (currentPage - 1) * rowsPerPage;
  const end = Math.min(start + rowsPerPage, total);
  const pageData = filteredData.slice(start, end);

  // Update info
  const infoText = total === 0 
    ? 'Tiada rekod dijumpai' 
    : `Menunjukkan ${start + 1}–${end} daripada ${total.toLocaleString()} rekod`;
  document.getElementById('results-info').textContent = infoText;
  document.getElementById('results-info-bottom').textContent = infoText;
  document.getElementById('total-count').textContent = total.toLocaleString();

  // Table
  const tbody = document.getElementById('table-body');
  const emptyState = document.getElementById('empty-state');

  if (pageData.length === 0) {
    tbody.innerHTML = '';
    emptyState.classList.remove('hidden');
  } else {
    emptyState.classList.add('hidden');
    tbody.innerHTML = pageData.map((row, idx) => {
      const startYear = getYear(row['Tarikh Aktiviti Mula']);
      const badgeClass = yearColors[startYear] || 'bg-gray-100 text-gray-500';
      const yearBadge = startYear ? `<span class="badge-year ${badgeClass}">${startYear}</span>` : '';
      const rowNum = start + idx + 1;

      return `<tr class="table-row border-b border-gray-100 last:border-0">
        <td class="px-4 py-3 text-gray-400 text-xs font-mono">${rowNum}</td>
        <td class="px-4 py-3">
          <span class="font-mono text-xs text-gray-800 bg-gray-100 px-1.5 py-0.5 rounded">${highlight(row['No Lesen'], searchTerm)}</span>
        </td>
        <td class="px-4 py-3 text-gray-700 text-sm">${highlight(row['Nama Syarikat'], searchTerm)}</td>
        <td class="px-4 py-3 text-gray-900 font-medium">${highlight(row['Nama Aktiviti'], searchTerm)}</td>
        <td class="px-4 py-3">${yearBadge}</td>
        <td class="px-4 py-3 text-gray-500 text-xs whitespace-nowrap">${escapeHtml(row['Tarikh Aktiviti Mula'])}</td>
        <td class="px-4 py-3 text-gray-500 text-xs whitespace-nowrap">${escapeHtml(row['Tarikh Aktiviti Tamat'])}</td>
      </tr>`;
    }).join('');
  }

  // Pagination
  renderPagination('pagination-bottom', totalPages);
}

function renderPagination(containerId, totalPages) {
  const container = document.getElementById(containerId);
  if (totalPages <= 1) { container.innerHTML = ''; return; }

  const maxVisible = 7;
  let pages = [];

  if (totalPages <= maxVisible) {
    pages = Array.from({length: totalPages}, (_, i) => i + 1);
  } else {
    const half = Math.floor(maxVisible / 2);
    let start = Math.max(1, currentPage - half);
    let end = Math.min(totalPages, start + maxVisible - 1);
    if (end - start < maxVisible - 1) start = Math.max(1, end - maxVisible + 1);

    pages = [];
    if (start > 1) { pages.push(1); if (start > 2) pages.push('...'); }
    for (let p = start; p <= end; p++) pages.push(p);
    if (end < totalPages) { if (end < totalPages - 1) pages.push('...'); pages.push(totalPages); }
  }

  const btnClass = (p) => `page-btn px-3 py-1.5 rounded-lg text-sm font-medium border ${
    p === currentPage 
      ? 'active border-gray-900' 
      : 'border-gray-200 text-gray-600'
  }`;

  const prevDisabled = currentPage === 1 ? 'disabled' : '';
  const nextDisabled = currentPage === totalPages ? 'disabled' : '';

  container.innerHTML = `
    <button class="page-btn ${prevDisabled} px-3 py-1.5 rounded-lg text-sm font-medium border border-gray-200 text-gray-600" onclick="goPage(${currentPage - 1})">‹ Prev</button>
    ${pages.map(p => p === '...' 
      ? '<span class="px-2 py-1.5 text-gray-400 text-sm">…</span>'
      : `<button class="${btnClass(p)}" onclick="goPage(${p})">${p}</button>`
    ).join('')}
    <button class="page-btn ${nextDisabled} px-3 py-1.5 rounded-lg text-sm font-medium border border-gray-200 text-gray-600" onclick="goPage(${currentPage + 1})">Next ›</button>
  `;
}

function goPage(p) {
  const totalPages = Math.ceil(filteredData.length / rowsPerPage);
  if (p < 1 || p > totalPages) return;
  currentPage = p;
  render();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

// Events
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    searchTerm = e.target.value;
    applyFilters();
  }, 250);
});

document.getElementById('year-filter').addEventListener('change', e => {
  yearFilter = e.target.value;
  applyFilters();
});

document.getElementById('rows-per-page').addEventListener('change', e => {
  rowsPerPage = parseInt(e.target.value);
  currentPage = 1;
  render();
});

document.getElementById('clear-btn').addEventListener('click', () => {
  document.getElementById('search-input').value = '';
  document.getElementById('year-filter').value = '';
  searchTerm = '';
  yearFilter = '';
  rowsPerPage = 50;
  document.getElementById('rows-per-page').value = '50';
  applyFilters();
});

// Init
render();
</script>
